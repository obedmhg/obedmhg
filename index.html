<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>obed-murillo — console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0A0E14;
    --panel:#10161F;
    --panel2:#0D131B;
    --line:#1E2733;
    --line2:#283442;
    --text:#9FB0C0;
    --bright:#E7EEF5;
    --dim:#5E6E7E;
    --cyan:#6FD6E6;
    --amber:#E8B161;
    --ok:#74C99A;
    --maxw:1060px;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:"JetBrains Mono",ui-monospace,monospace;
    font-size:14.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(900px 500px at 80% -10%, rgba(111,214,230,.06), transparent 60%),
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:auto, 46px 46px, 46px 46px;
    background-position:0 0, 0 0, 0 0;
  }
  .grain{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(0,0,0,.35));z-index:0;}
  .wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 22px 90px;}
  .sans{font-family:"Space Grotesk",sans-serif;}
  a{color:var(--cyan);text-decoration:none;}
  a:hover{text-decoration:underline;}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}


  /* terminal hero */
  .term{
    margin-top:64px;border:1px solid var(--line2);border-radius:12px;overflow:hidden;
    background:linear-gradient(180deg,var(--panel),var(--panel2));
    box-shadow:0 30px 70px -40px rgba(0,0,0,.9);
  }
  .term-bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015);}
  .dot{width:11px;height:11px;border-radius:50%;}
  .dot.r{background:#FF5F56;}.dot.y{background:#FFBD2E;}.dot.g{background:#27C93F;}
  .term-bar .path{margin-left:10px;color:var(--dim);font-size:12.5px;}
  .term-body{padding:26px 26px 30px;display:grid;grid-template-columns:1fr 132px;gap:26px;align-items:center;}
  .prompt{color:var(--dim);}
  .prompt .u{color:var(--ok);}
  .prompt .c{color:var(--cyan);}
  .term h1{
    font-family:"Space Grotesk",sans-serif;font-weight:700;
    font-size:clamp(34px,6vw,58px);line-height:1.02;letter-spacing:-.02em;
    color:var(--bright);margin:6px 0 4px;
  }
  .cursor{display:inline-block;width:11px;height:.95em;background:var(--cyan);vertical-align:-2px;margin-left:4px;animation:blink 1.1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}
  .term .title{color:var(--amber);font-size:15px;}
  .term .sub{color:var(--text);font-size:13.5px;margin-top:10px;}
  .term .sub .k{color:var(--dim);}
  .avatar{width:132px;height:132px;border-radius:10px;object-fit:cover;border:1px solid var(--line2);filter:grayscale(.3) brightness(.95);}

  /* meta chips under hero */
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 8px;}
  .chip{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 12px;font-size:12.5px;}
  .chip b{color:var(--cyan);font-weight:500;}

  /* panels */
  section{margin-top:46px;}
  .sec-label{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:12.5px;margin-bottom:16px;}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .sec-label .hash{color:var(--cyan);}
  .panel{border:1px solid var(--line);border-radius:10px;background:rgba(16,22,31,.7);backdrop-filter:blur(2px);padding:24px;}
  .panel p{margin:0 0 12px;}
  .panel p:last-child{margin-bottom:0;}
  .panel .comment{color:var(--dim);}

  /* deploy log */
  .log{position:relative;padding-left:8px;}
  .entry{position:relative;display:grid;grid-template-columns:150px 1fr;gap:22px;padding:18px 0;border-top:1px dashed var(--line);}
  .entry:first-child{border-top:0;}
  .entry .left{position:relative;}
  .entry .ver{color:var(--amber);font-weight:500;font-size:13px;}
  .entry .when{color:var(--dim);font-size:12px;display:block;margin-top:2px;}
  .entry .stamp{color:var(--dim);font-size:11.5px;display:block;margin-top:6px;}
  .status{display:inline-block;font-size:10px;letter-spacing:.1em;padding:2px 8px;border-radius:4px;margin-top:8px;}
  .status.active{color:var(--ok);border:1px solid rgba(116,201,154,.4);background:rgba(116,201,154,.08);}
  .status.shipped{color:var(--dim);border:1px solid var(--line2);}
  .node{position:relative;}
  .node::before{content:"";position:absolute;left:-20px;top:6px;width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(111,214,230,.12);}
  .entry.active .node::before{background:var(--ok);box-shadow:0 0 0 4px rgba(116,201,154,.15);}
  .right{border-left:1px solid var(--line);padding-left:24px;}
  .entry h3{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:18px;color:var(--bright);margin:0 0 2px;}
  .entry .repo{color:var(--cyan);font-size:13px;margin-bottom:10px;}
  .entry ul{margin:0 0 10px;padding:0;list-style:none;}
  .entry li{position:relative;padding-left:18px;margin-bottom:5px;color:var(--text);}
  .entry li::before{content:"›";position:absolute;left:0;color:var(--cyan);}
  .entry .flags{color:var(--dim);font-size:12.5px;}
  .entry .flags b{color:var(--amber);font-weight:400;}

  /* skills as token list */
  .stack{display:flex;flex-wrap:wrap;gap:8px;}
  .tok{font-size:12.5px;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--panel);}
  .tok:hover{border-color:var(--cyan);color:var(--cyan);}
  .tok .h{color:var(--dim);}

  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  .two h3{font-family:"Space Grotesk",sans-serif;color:var(--bright);font-weight:600;font-size:17px;margin:0 0 4px;}
  .two .meta{color:var(--dim);font-size:12px;margin-bottom:12px;}
  .file{display:flex;gap:10px;padding:10px 0;border-top:1px dashed var(--line);}
  .file:first-of-type{border-top:0;}
  .file .ic{color:var(--amber);}
  .file .nm{color:var(--bright);}
  .file .ds{color:var(--dim);font-size:12px;}

  footer{margin-top:46px;border-top:1px solid var(--line);padding-top:26px;}
  footer .cta{color:var(--ok);margin-bottom:14px;}
  footer .row{display:flex;flex-wrap:wrap;gap:10px 26px;}
  footer .row .k{color:var(--dim);}

  @media (max-width:760px){
    .term-body{grid-template-columns:1fr;}
    .avatar{width:96px;height:96px;order:-1;}
    .entry{grid-template-columns:1fr;gap:12px;}
    .right{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;}
    .node::before{display:none;}
    .two{grid-template-columns:1fr;}
    body{background-size:auto,32px 32px,32px 32px;}
  }
  @media (prefers-reduced-motion:reduce){.cursor{animation:none;}}
</style>
</head>
<body>
<div class="grain"></div>
<div id="app" class="wrap"></div>

<script>
const resumeData = {
  header:{ name:"Obed Murillo", title:"Director of Technology", experience:"17+ years in eCommerce & Digital Solutions", image:"profile.png" },
  about:{ summary:[
    "Senior Software Architect with over 17 years of experience specializing in e-commerce solutions.",
    "Currently Director of Technology at KogniVera, leading LATAM initiatives and driving innovation.",
    "Expert in Java, Oracle Commerce, commercetools, and cloud architectures."
  ]},
  skills:["Java","Oracle Commerce","ATG","commercetools","GCP","AWS","Docker","Jenkins","React.js","RESTful APIs","Cloud Architecture","CI/CD","Leadership","Innovation","LATAM Strategy","Team Coordination","Process Optimization","Client Success","Composable Commerce","Cloud Integration","E-Commerce"],
  experience:[
    {title:"Director of Technology - LATAM",company:"KogniVera",dates:"Apr 2025 - Present",location:"Mexico · Remote",duration:"1 mo",description:["Collaborate with partners, clients, and internal teams to drive innovation across LATAM.","Deliver tailored technology solutions that empower client success.","Build lasting partnerships through a fully invested and collaborative approach."],skills:["Leadership","Innovation","LATAM Strategy"]},
    {title:"Director of Technology",company:"Icreon",dates:"Jul 2024 - Apr 2025",location:"Remote",duration:"10 mos",description:["Ensure timely and high-quality eCommerce project delivery.","Coordinate offshore and onshore teams for seamless deployment.","Drive technological innovation and process optimization."],skills:["Team Coordination","Process Optimization","Client Success"]},
    {title:"Senior Commerce Architect Omni Channel",company:"changeCX",dates:"Nov 2022 - Jul 2024",location:"Chihuahua, Mexico",duration:"1 yr 9 mos",description:["Led teams implementing commercetools Composable Commerce and Frontend.","Designed end-to-end cloud and on-prem integration for large retailers.","Ensured quality delivery by managing both onshore and offshore teams."],skills:["commercetools","Composable Commerce","Cloud Integration"]},
    {title:"Solutions Architect",company:"Oracle",dates:"Apr 2021 - Nov 2022",location:"Chihuahua, Mexico",duration:"1 yr 8 mos",description:["Designed and supported eCommerce solutions for Oracle Commerce clients."],skills:["Oracle Commerce","E-Commerce","RESTful WebServices","React.js","Java","ATG"]},
    {title:"Senior Principal Consultant",company:"Oracle",dates:"Mar 2018 - Apr 2021",location:"Chihuahua Area, Mexico",duration:"3 yrs 2 mos",description:["Provided services to Oracle Commerce and OCC clients."],skills:["Oracle Commerce","E-Commerce","RESTful WebServices","React.js","Java","ATG"]},
    {title:"Solutions Architect (Contractor)",company:"e2x Limited",dates:"Dec 2016 - Mar 2018",location:"Chihuahua Area, Mexico",duration:"1 yr 4 mos",description:["Developed a B2B platform from discovery to production.","Integrated internal tools from design through testing."],skills:["Oracle Commerce","E-Commerce","RESTful WebServices","Java","ATG"]},
    {title:"Solutions Architect",company:"NU Technology Inc",dates:"Nov 2016 - Mar 2018",location:"Chihuahua Area, Mexico",duration:"1 yr 5 mos",description:["Implemented scalable eCommerce solutions using Oracle Commerce and CSA Model."],skills:["Oracle Commerce","E-Commerce","RESTful WebServices","Java","ATG"]},
    {title:"ATG Technical Architect",company:"AutoZone",dates:"Feb 2016 - Nov 2016",location:"Chihuahua Area, Mexico",duration:"10 mos",description:["Supported and developed AutoZone's eCommerce platform."],skills:["Oracle Commerce","E-Commerce","RESTful WebServices","Java","ATG"]},
    {title:"ATG Lead Developer",company:"Speed Commerce",dates:"Mar 2012 - Feb 2016",location:"Chihuahua Area, Mexico",duration:"4 yrs",description:["Led ATG development team in project delivery and support.","Worked on Toys R Us UK, Poland and Justice projects with custom ATG implementations."],skills:["Oracle Commerce","Java","ATG"]},
    {title:"ATG Developer",company:"Speed Commerce",dates:"Mar 2012 - Feb 2014",location:"Chihuahua Area, Mexico",duration:"2 yrs",description:["Supported and developed ATG eCommerce applications."],skills:["Oracle Commerce","Java","ATG"]}
  ],
  podcast:{ title:"From Zero to N", dates:"Aug 2021 - Present", duration:"3 yrs 9 mos", description:"Podcast host on From Zero to N, talking with interesting people about their life experiences, passions, recommendations, and more." },
  certifications:[
    {name:"SCJP (Sun Certified Java Programmer)",institution:"Java 1.4 Platform",date:"Certification"},
    {name:"Oracle Commerce Specialist",institution:"ATG Implementation",date:"Certification"}
  ],
  contact:{ location:"Chihuahua, Mexico", email:"obedmhg@gmail.com", phone:"+52 614 182 5638" }
};

const MON={Jan:"01",Feb:"02",Mar:"03",Apr:"04",May:"05",Jun:"06",Jul:"07",Aug:"08",Sep:"09",Oct:"10",Nov:"11",Dec:"12"};
function ver(dates){ const m=dates.match(/([A-Za-z]{3})\s+(\d{4})/); return m?`v${m[2]}.${MON[m[1]]||"00"}`:"v0000.00"; }
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/(^-|-$)/g,"");
const isPresent = d => /present/i.test(d);

function render(){
  const d=resumeData;
  const companies=new Set(d.experience.map(e=>e.company)).size;

  const entries = d.experience.map(e=>{
    const active=isPresent(e.dates);
    return `
    <div class="entry ${active?'active':''}">
      <div class="left">
        <span class="ver">${ver(e.dates)}</span>
        <span class="when">${e.dates}</span>
        <span class="stamp">${e.location}</span>
        <span class="status ${active?'active':'shipped'}">${active?'● ACTIVE':'✓ SHIPPED'}</span>
      </div>
      <div class="right node">
        <h3>${e.title}</h3>
        <div class="repo">${slug(e.title)}@${slug(e.company)} · ${e.duration}</div>
        <ul>${e.description.map(x=>`<li>${x}</li>`).join("")}</ul>
        <div class="flags"><b>--stack</b> ${e.skills.map(s=>s.toLowerCase().replace(/\s+/g,'-')).join(" ")}</div>
      </div>
    </div>`;
  }).join("");

  document.getElementById("app").innerHTML = `
    <section class="term">
      <div class="term-bar">
        <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
        <span class="path">~/obed-murillo — zsh</span>
      </div>
      <div class="term-body">
        <div>
          <div class="prompt"><span class="u">obed</span>@<span class="c">latam</span>:~$ whoami</div>
          <h1>${d.header.name}<span class="cursor"></span></h1>
          <div class="title">› ${d.header.title} @ KogniVera</div>
          <div class="sub"><span class="k">role  </span>commerce architect · systems &amp; cloud<br>
          <span class="k">exp   </span>${d.header.experience}<br>
          <span class="k">base  </span>${d.contact.location}</div>
        </div>
        <img class="avatar" src="${d.header.image}" alt="Portrait of ${d.header.name}" />
      </div>
    </section>

    <div class="chips">
      <span class="chip"><b>17+</b> yrs uptime</span>
      <span class="chip"><b>${d.experience.length}</b> roles deployed</span>
      <span class="chip"><b>${companies}</b> companies</span>
      <span class="chip"><b>2</b> certifications</span>
      <span class="chip"><b>1</b> podcast running</span>
    </div>

    <section>
      <div class="sec-label"><span class="hash">#</span> cat profile.md</div>
      <div class="panel">
        <p class="comment"># professional summary</p>
        ${d.about.summary.map(p=>`<p>${p}</p>`).join("")}
      </div>
    </section>

    <section>
      <div class="sec-label"><span class="hash">#</span> git log --career</div>
      <div class="log">${entries}</div>
    </section>

    <section>
      <div class="sec-label"><span class="hash">#</span> stack --list</div>
      <div class="stack">${d.skills.map(s=>`<span class="tok"><span class="h">#</span>${s}</span>`).join("")}</div>
    </section>

    <section>
      <div class="sec-label"><span class="hash">#</span> ls extras/</div>
      <div class="two">
        <div class="panel">
          <h3>🎙 ${d.podcast.title}</h3>
          <div class="meta">${d.podcast.dates} · ${d.podcast.duration} · status: live</div>
          <p>${d.podcast.description}</p>
        </div>
        <div class="panel">
          <h3>certifications/</h3>
          <div class="meta">${d.certifications.length} files</div>
          ${d.certifications.map(c=>`<div class="file"><span class="ic">▤</span><span><span class="nm">${c.name}</span><br><span class="ds">${c.institution}</span></span></div>`).join("")}
        </div>
      </div>
    </section>

    <footer>
      <div class="cta">$ open to consulting &amp; technical leadership roles</div>
      <div class="row">
        <span><span class="k">email →</span> <a href="mailto:${d.contact.email}">${d.contact.email}</a></span>
        <span><span class="k">tel   →</span> <a href="tel:${d.contact.phone.replace(/\s/g,'')}">${d.contact.phone}</a></span>
        <span><span class="k">loc   →</span> ${d.contact.location}</span>
      </div>
    </footer>
  `;
}
render();
</script>
</body>
</html>
